<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Board by Kelevra</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <style>
        /* Wir geben der Karte eine feste Höhe, sonst wird sie nicht angezeigt */
        #map { height: 400px; }
    </style>
</head>
<body class="bg-slate-800 text-slate-200 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-slate-700 rounded-2xl shadow-xl p-6 flex flex-col sm:flex-row justify-between items-center border border-slate-600 gap-4">
            <h1 class="text-3xl font-bold text-white">
                DB <span class="text-cyan-400">Dash</span>board
            </h1>
            
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <select id="tripSelector" class="hidden bg-slate-800 text-slate-200 font-semibold py-2 px-4 rounded-xl shadow-inner border border-slate-600 outline-none focus:ring-2 focus:ring-cyan-500 cursor-pointer flex-grow">
                </select>

                <label class="cursor-pointer bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-2 px-6 rounded-xl shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1 whitespace-nowrap">
                    Datenbank laden
                    <input type="file" id="dbInput" accept=".db,.sqlite" class="hidden" />
                </label>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            
            <div class="bg-slate-700 rounded-2xl shadow-xl p-6 border border-slate-600 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-white">Route</h2>
                    <button id="toggleColorBtn" class="hidden bg-slate-600 hover:bg-slate-500 text-xs text-white py-1.5 px-3 rounded-lg shadow transition-colors font-bold tracking-wide">
                        Speed-Map: AUS
                    </button>
                </div>
                <div id="map" class="rounded-xl overflow-hidden shadow-inner bg-slate-800 z-0 flex-grow min-h-[400px]"></div>
            </div>

            <div id="exportArea" class="flex flex-col gap-6 p-4 -m-4 rounded-3xl">
            
            <div class="bg-slate-700 rounded-2xl shadow-xl p-6 border border-slate-600 flex flex-col">
                <h2 class="text-xl font-semibold text-white mb-4">Analyse</h2>
                <div class="flex-grow bg-slate-800 rounded-xl p-4 shadow-inner relative min-h-[400px] w-full">
                    <canvas id="vibeChart"></canvas>
                </div>
            </div>

            <div class="bg-slate-700 rounded-2xl shadow-xl p-6 border border-slate-600 flex flex-col hidden" id="statsContainer">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-white">Fahrtdaten</h2>
                    <button id="exportBtn" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-1.5 px-4 rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-1 text-sm flex items-center gap-2">
                        <span>📸</span> Als Bild teilen
                    </button>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-4">
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Distanz</p>
                        <p class="text-2xl font-bold text-cyan-400"><span id="stat-dist">0.00</span> <span class="text-sm font-normal text-slate-400">km</span></p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Dauer</p>
                        <p class="text-2xl font-bold text-white" id="stat-time">00:00</p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Top-Speed</p>
                        <p class="text-2xl font-bold text-white"><span id="stat-max-speed">0</span> <span class="text-sm font-normal text-slate-400">km/h</span></p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Ø-Speed</p>
                        <p class="text-2xl font-bold text-white"><span id="stat-avg-speed">0</span> <span class="text-sm font-normal text-slate-400">km/h</span></p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Max Höhe</p>
                        <p class="text-2xl font-bold text-amber-500"><span id="stat-max-ele">0</span> <span class="text-sm font-normal text-slate-400">m</span></p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Min Höhe</p>
                        <p class="text-2xl font-bold text-amber-500"><span id="stat-min-ele">0</span> <span class="text-sm font-normal text-slate-400">m</span></p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Max Gas</p>
                        <p class="text-2xl font-bold text-green-400"><span id="stat-max-accel">0.00</span> <span class="text-sm font-normal text-slate-400">G</span></p>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-xl shadow-inner text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Max Bremse</p>
                        <p class="text-2xl font-bold text-red-400"><span id="stat-max-brake">0.00</span> <span class="text-sm font-normal text-slate-400">G</span></p>
                    </div>
                </div>
                </div>
            </div>

            <div id="watermark" class="hidden text-center text-slate-400 text-sm font-medium mt-2">
                Tour von <span id="wm-name" class="text-cyan-400"></span> am <span id="wm-date" class="text-white"></span>
            </div>

        </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
    console.log("Vibe Tracker ist bereit!");

    // --- Globale Variablen ---
    let map; 
    let mapLayerGroup; // Ein unsichtbarer Ordner, in den wir alle Linien packen
    let currentRouteData = []; // Hier speichern wir die Route, damit wir sie auf Knopfdruck neu zeichnen können
    let isSpeedColorMode = false;

    // --- 1. Karte SOFORT laden ---
    // Startpunkt Leipzig (deine Heimat), Zoom-Level 13
    map = L.map('map').setView([51.340199, 12.360103], 13); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // Diese Gruppe liegt auf der Karte. Wenn wir sie leeren, verschwindet die Route.
    mapLayerGroup = L.featureGroup().addTo(map);


    // --- 2. Button-Logik für Speed-Toggle ---
    const toggleBtn = document.getElementById('toggleColorBtn');
    toggleBtn.addEventListener('click', function() {
        // Modus umkehren
        isSpeedColorMode = !isSpeedColorMode;
        
        // Button optisch anpassen
        this.innerText = isSpeedColorMode ? "Speed-Map: AN" : "Speed-Map: AUS";
        this.classList.toggle('bg-cyan-600', isSpeedColorMode);
        this.classList.toggle('text-slate-900', isSpeedColorMode);
        this.classList.toggle('bg-slate-600', !isSpeedColorMode);
        
        // Route neu zeichnen, wenn Daten da sind
        if (currentRouteData.length > 0) {
            drawMap(currentRouteData);
        }
    });


    // --- 3. SQLite Upload und Multi-Tour-Parsing ---
    const dbInput = document.getElementById('dbInput');
    const tripSelector = document.getElementById('tripSelector');
    let globalDB = null; // Wir speichern die Datenbank global ab

    dbInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        console.log("Datenbank ausgewählt:", file.name);

        const reader = new FileReader();
        reader.onload = async function(e) {
            // Datenbanken sind binär, also Uint8Array nutzen
            const Uints = new Uint8Array(e.target.result);
            await parseDatabase(Uints);
        };
        reader.readAsArrayBuffer(file); 
    });

    async function parseDatabase(uints) {
        console.log("Initialisiere Datenbank-Engine...");
        
        // sql.js laden
        const SQL = await initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });
        
        globalDB = new SQL.Database(uints);
        
        // Hole alle Fahrten aus der Session-Tabelle, sortiert nach der neuesten
        const sessionsQuery = globalDB.exec("SELECT rowid, start, distance FROM sesstb ORDER BY rowid DESC");
        
        if (sessionsQuery.length === 0) {
            alert("Keine Fahrten in der Datenbank gefunden!");
            return;
        }

        // Dropdown leeren und neu befüllen
        tripSelector.innerHTML = '';
        const rows = sessionsQuery[0].values;
        
        rows.forEach(row => {
            const sid = row[0];
            const startText = row[1] || `Tour vom ${sid}`; // Fallback, falls 'start' leer ist
            
            const option = document.createElement('option');
            option.value = sid;
            option.textContent = `Tour: ${startText} (ID: ${sid})`;
            tripSelector.appendChild(option);
        });

        // Dropdown sichtbar machen
        tripSelector.classList.remove('hidden');

        // Die allererste Fahrt aus der Liste direkt laden
        loadTrip(rows[0][0]);
    }

    // Wenn der Nutzer eine andere Fahrt im Dropdown auswählt
    tripSelector.addEventListener('change', function() {
        console.log("Lade Tour ID:", this.value);
        loadTrip(this.value);
    });

    // Diese Funktion holt die GPS-Punkte für eine bestimmte Session-ID (sid)
    function loadTrip(sid) {
        const routeResult = globalDB.exec(`
            SELECT latitude, longitude, speed, altitude, timestamp 
            FROM pottb 
            WHERE sid = ${sid} 
            ORDER BY timestamp ASC
        `);

        if (routeResult.length === 0) {
            console.log("Keine GPS-Punkte für diese Tour gefunden.");
            return;
        }

        currentRouteData = [];
        const rows = routeResult[0].values;
        
        rows.forEach(row => {
            const lat = row[0];
            const lon = row[1];
            const speedMs = row[2];
            const ele = row[3];
            let timeVal = row[4]; 
            
            // Unix-Timestamp in Millisekunden umrechnen, falls er in Sekunden gespeichert ist
            if (timeVal < 10000000000) timeVal *= 1000;
            const dateObj = new Date(timeVal);

            currentRouteData.push({
                lat: lat,
                lon: lon,
                elevation: ele,
                time: dateObj,
                speedKmh: speedMs * 3.6 // m/s in km/h
            });
        });

        console.log(`Erfolgreich geladen! ${currentRouteData.length} Wegpunkte auf der Karte.`);

        // Toggle-Button für die Farbe sichtbar machen
        document.getElementById('toggleColorBtn').classList.remove('hidden');
        
        // Karte, Chart und Statistiken mit den neuen Daten updaten!
        drawMap(currentRouteData);
        drawChart(currentRouteData);
        calculateStats(currentRouteData);
    }


    // --- 4. Route auf die Karte zeichnen ---
    function drawMap(routeData) {
        // Alte Route restlos entfernen
        mapLayerGroup.clearLayers();

        // 1. Die Route zeichnen (entweder einfarbig oder als Speed-Map)
        if (!isSpeedColorMode) {
            // STANDARD MODUS
            const coordinates = routeData.map(pt => [pt.lat, pt.lon]);
            L.polyline(coordinates, {
                color: '#06b6d4', 
                weight: 4,        
                opacity: 0.8,     
                lineJoin: 'round'
            }).addTo(mapLayerGroup);

        } else {
            // SPEED MODUS
            const speeds = routeData.map(pt => pt.speedKmh);
            let maxSpeedForColor = Math.max(...speeds);
            if (maxSpeedForColor <= 0) maxSpeedForColor = 1; 

            for (let i = 0; i < routeData.length - 1; i++) {
                const p1 = routeData[i];
                const p2 = routeData[i+1];
                const currentSpeed = p1.speedKmh;
                
                const hue = 200 - ((currentSpeed / maxSpeedForColor) * 200);
                const color = `hsl(${hue}, 100%, 50%)`;

                L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {
                    color: color,
                    weight: 4,
                    opacity: 0.9,
                    lineJoin: 'round'
                }).addTo(mapLayerGroup);
            }
        }

        // 2. Den Top-Speed-Punkt finden
        let maxSpeedPoint = routeData[0];
        routeData.forEach(pt => {
            if (pt.speedKmh > maxSpeedPoint.speedKmh) {
                maxSpeedPoint = pt;
            }
        });

        // 3. Top-Speed-Marker setzen
        if (maxSpeedPoint && maxSpeedPoint.speedKmh > 0) {
            const speedMarker = L.circleMarker([maxSpeedPoint.lat, maxSpeedPoint.lon], {
                radius: 8,
                fillColor: "#ef4444", // Rot
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(mapLayerGroup);

            const timeString = maxSpeedPoint.time ? maxSpeedPoint.time.toLocaleTimeString('de-DE') : '';
            speedMarker.bindPopup(`
                <div style="text-align: center; font-family: sans-serif;">
                    <strong style="color: #ef4444; font-size: 1.1rem;">TOP SPEED</strong><br>
                    <span style="font-size: 1.3rem; font-weight: bold; color: #1e293b;">${Math.round(maxSpeedPoint.speedKmh)} km/h</span><br>
                    <span style="color: #64748b; font-size: 0.8rem;">um ${timeString} Uhr</span>
                </div>
            `);
        }

        // 4. Start- und End-Marker setzen
        if (routeData.length > 0) {
            const startPt = routeData[0];
            const endPt = routeData[routeData.length - 1];

            // Start-Marker (Grün)
            const startMarker = L.circleMarker([startPt.lat, startPt.lon], {
                radius: 6,
                fillColor: "#22c55e", // Grün
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(mapLayerGroup);

            const startTimeStr = startPt.time ? startPt.time.toLocaleTimeString('de-DE') : '';
            startMarker.bindPopup(`
                <div style="text-align: center; font-family: sans-serif;">
                    <strong style="color: #22c55e; font-size: 1.1rem;">START</strong><br>
                    <span style="color: #64748b; font-size: 0.8rem;">um ${startTimeStr} Uhr</span>
                </div>
            `);

            // End-Marker (Violett)
            const endMarker = L.circleMarker([endPt.lat, endPt.lon], {
                radius: 6,
                fillColor: "#d946ef", // Violett
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(mapLayerGroup);

            const endTimeStr = endPt.time ? endPt.time.toLocaleTimeString('de-DE') : '';
            endMarker.bindPopup(`
                <div style="text-align: center; font-family: sans-serif;">
                    <strong style="color: #d946ef; font-size: 1.1rem;">ZIEL</strong><br>
                    <span style="color: #64748b; font-size: 0.8rem;">um ${endTimeStr} Uhr</span>
                </div>
            `);
        }

        // Karte geschmeidig an die neue Route anpassen
        map.fitBounds(mapLayerGroup.getBounds(), { padding: [20, 20] });
    }
    // --- 5. Chart.js Graph zeichnen ---
    // Globale Variable für den Chart, damit wir ihn bei neuem Upload zerstören und neu bauen können
    let vibeChartInstance = null;

    function drawChart(routeData) {
        const ctx = document.getElementById('vibeChart').getContext('2d');

        // Alten Chart killen, bevor wir einen neuen malen (verhindert Glitches)
        if (vibeChartInstance) {
            vibeChartInstance.destroy();
        }

        // Daten für den Chart vorbereiten
        // Wir formatieren die Zeitstempel zu lesbaren Uhrzeiten (HH:MM:SS)
        const labels = routeData.map(pt => pt.time ? pt.time.toLocaleTimeString('de-DE') : '');
        const speedData = routeData.map(pt => pt.speedKmh);
        const eleData = routeData.map(pt => pt.elevation);

        vibeChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Speed (km/h)',
                        data: speedData,
                        borderColor: '#06b6d4', // Unser Cyan-Blau
                        backgroundColor: 'rgba(6, 182, 212, 0.1)', // Leichter Schimmer unter der Linie
                        borderWidth: 2,
                        yAxisID: 'y', // Bindung an linke Achse
                        fill: true,
                        pointRadius: 0, // Versteckt die kleinen Punkte für einen cleanen Look
                        tension: 0.4 // Macht die Linie geschmeidig abgerundet
                    },
                    {
                        label: 'Höhe (m)',
                        data: eleData,
                        borderColor: '#f59e0b', // Amber/Orange
                        backgroundColor: 'rgba(245, 158, 11, 0.0)',
                        borderWidth: 2,
                        yAxisID: 'y1', // Bindung an rechte Achse
                        fill: false,
                        pointRadius: 0,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false, // Tooltip zeigt beide Werte, wenn man nur in der Nähe ist
                },
                plugins: {
                    legend: {
                        labels: { color: '#cbd5e1' } // Textfarbe Legende
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#94a3b8', maxTicksLimit: 8 }, // Nicht zu viele Zeiten auf der X-Achse
                        grid: { color: '#334155' } // Dunkles Gitternetz
                    },
                    y: { // Linke Achse (Speed)
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'km/h', color: '#06b6d4' },
                        ticks: { color: '#06b6d4' },
                        grid: { color: '#334155' }
                    },
                    y1: { // Rechte Achse (Höhe)
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Meter', color: '#f59e0b' },
                        ticks: { color: '#f59e0b' },
                        grid: { drawOnChartArea: false } // Verhindert Gitter-Chaos
                    }
                }
            }
        });
    }
    // --- 6. Statistiken berechnen und anzeigen ---
    function calculateStats(routeData) {
        if (routeData.length < 2) return;

        const speeds = routeData.map(pt => pt.speedKmh);
        const elevations = routeData.map(pt => pt.elevation);

        const maxSpeed = Math.max(...speeds);
        const maxEle = Math.max(...elevations);
        const minEle = Math.min(...elevations);

        let totalDistanceKm = 0;
        let maxAcceleration = 0;
        let maxDeceleration = 0;

        for (let i = 0; i < routeData.length - 1; i++) {
            const pt1 = routeData[i];
            const pt2 = routeData[i+1];

            // Distanz
            totalDistanceKm += getDistanceFromLatLonInKm(
                pt1.lat, pt1.lon, 
                pt2.lat, pt2.lon
            );

            // Beschleunigung berechnen
            if (pt1.time && pt2.time) {
                // Zeitdifferenz in Sekunden
                const timeDiffSec = (pt2.time - pt1.time) / 1000;
                
                if (timeDiffSec > 0) {
                    // Geschwindigkeit von km/h zurück in m/s für die korrekte physikalische Einheit
                    const v1 = pt1.speedKmh / 3.6;
                    const v2 = pt2.speedKmh / 3.6;
                    
                    // a = delta V / delta t
                    const acceleration = (v2 - v1) / timeDiffSec;

                    // Werte speichern (Aussortieren von krassen GPS-Fehlern, z.B. > 15 m/s²)
                    if (acceleration > maxAcceleration && acceleration < 15) {
                        maxAcceleration = acceleration;
                    }
                    // Negative Beschleunigung = Bremsen
                    if (acceleration < maxDeceleration && acceleration > -15) {
                        maxDeceleration = acceleration;
                    }
                }
            }
        }

        const startTime = routeData[0].time;
        const endTime = routeData[routeData.length - 1].time;
        let durationStr = "00:00";
        let avgSpeed = 0;

        if (startTime && endTime) {
            const diffMs = endTime - startTime;
            const diffMins = Math.floor(diffMs / 60000);
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            
            durationStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

            const durationHours = diffMs / (1000 * 60 * 60);
            if (durationHours > 0) {
                avgSpeed = totalDistanceKm / durationHours;
            }
        }

        document.getElementById('stat-dist').innerText = totalDistanceKm.toFixed(2);
        document.getElementById('stat-time').innerText = durationStr;
        document.getElementById('stat-max-speed').innerText = Math.round(maxSpeed);
        document.getElementById('stat-avg-speed').innerText = Math.round(avgSpeed);
        document.getElementById('stat-max-ele').innerText = Math.round(maxEle);
        document.getElementById('stat-min-ele').innerText = Math.round(minEle);
        
        // NEU: Umrechnung in G-Kräfte (1 G = 9.81 m/s²)
        const gForceAccel = maxAcceleration / 9.81;
        const gForceBrake = Math.abs(maxDeceleration) / 9.81;

        // Wir runden auf 2 Nachkommastellen für die feine Telemetrie-Optik
        document.getElementById('stat-max-accel').innerText = gForceAccel.toFixed(2);
        document.getElementById('stat-max-brake').innerText = gForceBrake.toFixed(2);

        // Statistik-Container sichtbar machen
        document.getElementById('statsContainer').classList.remove('hidden');
    }

    // Hilfsfunktion: Berechnet Distanz zwischen zwei GPS-Koordinaten in Kilometern
    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
        const R = 6371; // Erdradius in km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
    // --- 7. Export als Bild (mit Name und Graphen) ---
    document.getElementById('exportBtn').addEventListener('click', function() {
        
        // 1. Namen des Fahrers abfragen
        const riderName = prompt("Wer ist diese Legenden-Tour gefahren?", "Vibe Rider") || "Vibe Rider";
        
        // 2. Datum der Fahrt aus den GPX-Daten holen (z. B. "30.6.2026")
        const tourDate = currentRouteData[0]?.time 
            ? currentRouteData[0].time.toLocaleDateString('de-DE') 
            : 'Unbekanntes Datum';

        // Elemente laden
        const exportArea = document.getElementById('exportArea');
        const btn = this;
        const watermark = document.getElementById('watermark');
        
        // 3. Wasserzeichen ausfüllen und anzeigen, Button verstecken
        document.getElementById('wm-name').innerText = riderName;
        document.getElementById('wm-date').innerText = tourDate;
        watermark.classList.remove('hidden');
        btn.style.display = 'none';
        
        // 4. Foto schießen!
        html2canvas(exportArea, {
            backgroundColor: '#1e293b', // Entspricht tailwind slate-800 für sauberen Hintergrund
            scale: 2 // Hohe Auflösung
        }).then(canvas => {
            
            // 5. Nach dem Foto: Wasserzeichen wieder verstecken und Button anzeigen
            watermark.classList.add('hidden');
            btn.style.display = 'flex';
            
            // 6. Download starten
            const link = document.createElement('a');
            // Dateiname wird automatisch aus dem Fahrernamen generiert
            link.download = `Tour-${riderName.replace(/\s+/g, '-')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    });
</script>
</body>
</html>
