<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Vibe Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Wir geben der Karte eine feste Höhe, sonst wird sie nicht angezeigt */
        #map { height: 400px; }
    </style>
</head>
<body class="bg-slate-800 text-slate-200 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-slate-700 rounded-2xl shadow-xl p-6 flex flex-col sm:flex-row justify-between items-center border border-slate-600">
            <h1 class="text-3xl font-bold text-white mb-4 sm:mb-0">
                GPX <span class="text-cyan-400">Vibe</span> Tracker
            </h1>
            
            <label class="cursor-pointer bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-2 px-6 rounded-xl shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1">
                GPX Datei laden
                <input type="file" id="gpxInput" accept=".gpx" class="hidden" />
            </label>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-slate-700 rounded-2xl shadow-xl p-6 border border-slate-600">
                <h2 class="text-xl font-semibold text-white mb-4">Route</h2>
                <div id="map" class="rounded-xl overflow-hidden shadow-inner bg-slate-800 z-0"></div>
            </div>

            <div class="bg-slate-700 rounded-2xl shadow-xl p-6 border border-slate-600 flex flex-col">
                <h2 class="text-xl font-semibold text-white mb-4">Geschwindigkeit</h2>
                <div class="flex-grow bg-slate-800 rounded-xl p-4 shadow-inner flex items-center justify-center min-h-[400px]">
                    <canvas id="speedChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
    console.log("Vibe Tracker ist bereit!");

    const gpxInput = document.getElementById('gpxInput');
    
    // Globale Variablen für Karte und Linie (damit wir sie bei neuen Uploads überschreiben können)
    let map; 
    let polyline;

    gpxInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        console.log("Datei ausgewählt:", file.name);

        const reader = new FileReader();
        reader.onload = function(e) {
            parseGPX(e.target.result);
        };
        reader.readAsText(file);
    });

    function parseGPX(gpxText) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(gpxText, "text/xml");
        
        const trackPoints = xmlDoc.querySelectorAll("trkpt");
        const routeData = [];

        trackPoints.forEach(pt => {
            const lat = parseFloat(pt.getAttribute("lat"));
            const lon = parseFloat(pt.getAttribute("lon"));
            const eleNode = pt.querySelector("ele");
            const timeNode = pt.querySelector("time");
            const speedNode = pt.querySelector("speed");

            routeData.push({
                lat: lat,
                lon: lon,
                elevation: eleNode ? parseFloat(eleNode.textContent) : 0,
                time: timeNode ? new Date(timeNode.textContent) : null,
                speed: speedNode ? parseFloat(speedNode.textContent) : 0
            });
        });

        console.log(`Erfolgreich geparst! ${routeData.length} Wegpunkte gefunden.`);
        
        // Karte zeichnen aufrufen!
        drawMap(routeData);
        
        // drawChart(routeData); // Kommt als Nächstes!
    }

    function drawMap(routeData) {
        // 1. Wenn noch keine Karte existiert, initialisieren wir sie
        if (!map) {
            // Startpunkt Leipzig, Zoom-Level 13
            map = L.map('map').setView([51.340199, 12.360103], 13); 

            // Ein schickes Dark-Mode Karten-Theme für den perfekten Vibe
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);
        }

        // 2. Falls schon eine Route auf der Karte liegt (z. B. 2. Upload), entfernen wir sie
        if (polyline) {
            map.removeLayer(polyline);
        }

        // 3. Koordinaten aus unserem routeData Array extrahieren: Leaflet braucht Format [[lat, lon], ...]
        const coordinates = routeData.map(pt => [pt.lat, pt.lon]);

        // 4. Die Linie zeichnen! Farbe: '#06b6d4' entspricht 'cyan-500' in Tailwind
        polyline = L.polyline(coordinates, {
            color: '#06b6d4', 
            weight: 4,        // Liniendicke
            opacity: 0.8,     // Leicht transparent
            lineJoin: 'round' // Weiche Kurven
        }).addTo(map);

        // 5. Die Karte automatisch heranzoomen und so zentrieren, dass die ganze Route sichtbar ist
        map.fitBounds(polyline.getBounds());
    }
</script>
</body>
</html>
